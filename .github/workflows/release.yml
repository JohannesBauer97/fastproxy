name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and publish macOS app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a release tag like v1.2.3"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER_ID \
            APPLE_API_KEY_P8_BASE64
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode -o "$certificate"
          security import "$certificate" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$certificate"

      - name: Inspect imported certificate
        if: always()
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          if [[ ! -f "$keychain" ]]; then
            echo "Signing keychain was not created."
            exit 0
          fi
          echo "Certificates in the signing keychain:"
          security find-certificate -a -Z "$keychain" | grep '"alis"' || true
          echo "All code signing identities:"
          security find-identity -p codesigning "$keychain" || true
          echo "Valid code signing identities:"
          security find-identity -v -p codesigning "$keychain" || true

      - name: Resolve signing identity
        id: signing
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning "$RUNNER_TEMP/app-signing.keychain-db" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' \
            | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found. The imported certificate must be a 'Developer ID Application' certificate, not an 'Apple Development' certificate. Check APPLE_CERTIFICATE_P12_BASE64 and APPLE_CERTIFICATE_PASSWORD."
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "Using signing identity: $identity"

      - name: Build app bundle
        env:
          FASTPROXY_VERSION: ${{ steps.version.outputs.version }}
          FASTPROXY_BUILD: ${{ github.run_number }}
          FASTPROXY_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./Scripts/build-app.sh

      - name: Verify signature
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -x dist/FastProxy.app/Contents/MacOS/FastProxy
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/FastProxy.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/FastProxy.app
          codesign -dv --verbose=4 dist/FastProxy.app 2>&1 | grep -q "Authority=Developer ID Application"
          codesign -dv --verbose=4 dist/FastProxy.app 2>&1 | grep -q "flags=.*runtime"

      - name: Notarize app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode -o "$key"
          chmod 600 "$key"

          notarization_zip="$RUNNER_TEMP/FastProxy-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/FastProxy.app "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --key "$key" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          # Apple's staple service occasionally returns a transient CloudKit
          # network error even after the notarization was accepted.
          staple_attempts=6
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple dist/FastProxy.app; then
              break
            fi
            if (( attempt == staple_attempts )); then
              echo "::error::Stapling failed after $staple_attempts attempts."
              exit 1
            fi
            echo "Stapling failed (attempt $attempt/$staple_attempts); retrying in 20 seconds..."
            sleep 20
          done

          xcrun stapler validate dist/FastProxy.app
          codesign --verify --deep --strict --verbose=2 dist/FastProxy.app
          spctl --assess --type execute --verbose=4 dist/FastProxy.app
          rm -f "$key" "$notarization_zip"

      - name: Package release archive
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          archive="FastProxy-${VERSION}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/FastProxy.app "dist/$archive"
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
          elif [[ "$VERSION" == *-* ]]; then
            gh release create "$RELEASE_TAG" "$ARCHIVE" \
              --verify-tag \
              --title "FastProxy $VERSION" \
              --generate-notes \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" \
              --verify-tag \
              --title "FastProxy $VERSION" \
              --generate-notes
          fi

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/FastProxy-notarization.zip" \
            "$RUNNER_TEMP/developer-id-application.p12"
